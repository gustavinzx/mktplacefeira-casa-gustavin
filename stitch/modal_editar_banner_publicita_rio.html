<body class="bg-surface">
<!-- Mock Admin Dashboard Background (SCREEN_19 Context) -->
<div class="min-h-screen p-md md:p-margin-desktop opacity-40 select-none pointer-events-none">
<header class="flex justify-between items-center mb-lg">
<h1 class="font-headline-md text-headline-md text-on-surface">Painel Administrativo</h1>
<div class="flex gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container-highest"></div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest"></div>
</div>
</header>
<div class="grid grid-cols-1 md:grid-cols-3 gap-md mb-lg">
<div class="bg-surface-container h-32 rounded-xl border border-outline-variant"></div>
<div class="bg-surface-container h-32 rounded-xl border border-outline-variant"></div>
<div class="bg-surface-container h-32 rounded-xl border border-outline-variant"></div>
</div>
<div class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant">
<div class="h-8 w-48 bg-surface-container mb-md rounded"></div>
<div class="space-y-sm">
<div class="h-12 w-full bg-surface-container rounded-lg"></div>
<div class="h-12 w-full bg-surface-container rounded-lg"></div>
<div class="h-12 w-full bg-surface-container rounded-lg"></div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-50 flex items-center justify-center p-margin-mobile">
<!-- Modal Content -->
<div class="bg-surface-container-lowest w-full max-w-2xl rounded-[32px] shadow-2xl border border-outline-variant overflow-hidden flex flex-col">
<!-- Modal Header -->
<div class="px-md py-md border-b border-surface-container-high flex justify-between items-center">
<h2 class="font-title-lg text-title-lg text-on-surface">Editar Banner Principal</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body (Form) -->
<div class="p-md md:p-lg space-y-md overflow-y-auto max-h-[716px]">
<!-- Upload Area (Drag and Drop) -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs">Imagem do Banner</label>
<div class="relative group">
<div class="border-2 border-dashed border-outline-variant rounded-2xl p-lg flex flex-col items-center justify-center gap-sm bg-surface-container-low hover:border-primary hover:bg-primary-container/5 transition-all cursor-pointer">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="add_photo_alternate">add_photo_alternate</span>
</div>
<div class="text-center">
<p class="font-title-lg text-[18px] text-on-surface">Arraste e solte a imagem aqui</p>
<p class="font-body-md text-label-sm text-on-surface-variant">PNG, JPG ou WEBP (Max. 5MB) - Ideal: 1920x600px</p>
</div>
<button class="mt-sm px-md py-xs bg-white border border-outline text-primary font-label-sm rounded-full hover:bg-surface-container transition-colors">Selecionar Arquivo</button>
</div>
</div>
</div>
<!-- Banner Preview (Small State) -->
<div class="rounded-xl overflow-hidden relative h-32 border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="vibrant farmers market banner with fresh vegetables organized in crates under morning sunlight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB--ll09dM3u4L11lzSaoG5ry84RLcD0uDUq_pSLqxHyawtQvX1L7wIMhK0L0Q5V13FVYjDc391jATakmeSa12PP7bq8vVQMYT7qvJJ4tMMm15EZOtgSnm_YmQVk11fS5fuq28-DO-CFWgPy5xS-diQ0THhg615G5ESS2aVzWqt50mkp5QxFXEOd8u7fUjawxD7Af3vseS4yTEz7lSy1EyNd2vn99B4_m_F0r4mijaugzw2X9xxTGmwxzz85ujnoi0tHBosmOknY8U"/>
<div class="absolute inset-0 bg-gradient-to-r from-black/50 to-transparent flex items-center px-md">
<span class="text-white font-title-lg">Preview Atual</span>
</div>
</div>
<!-- Input Groups -->
<div class="grid grid-cols-1 gap-md">
<!-- Title -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="banner_title">Título do Banner</label>
<input class="w-full px-md py-sm rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-on-surface" id="banner_title" placeholder="Ex: Feira da Estação: Produtos Frescos" type="text" value="Feira de Orgânicos deste Sábado"/>
</div>
<!-- Destination Link -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="banner_link">Link de Destino</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="link">link</span>
<input class="w-full pl-xl pr-md py-sm rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-on-surface" id="banner_link" placeholder="https://feira.casa/campanha" type="url" value="https://feira.casa/colecao-organicos"/>
</div>
</div>
<!-- Expiration Date -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="banner_expiry">Data de Expiração</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="calendar_today">calendar_today</span>
<input class="w-full pl-xl pr-md py-sm rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-on-surface" id="banner_expiry" type="date" value="2024-12-31"/>
</div>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-md py-md border-t border-surface-container-high flex flex-col-reverse sm:flex-row justify-end gap-sm bg-surface-container-low">
<button class="px-lg py-sm rounded-full font-label-sm text-on-surface-variant border border-outline-variant hover:bg-surface-container-high transition-colors">
                    Cancelar
                </button>
<button class="px-lg py-sm rounded-full font-label-sm text-white bg-primary hover:bg-primary-container hover:text-on-primary-container shadow-md active:scale-95 transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]" data-icon="save">save</span>

                </button>

<div class="flex justify-between items-center px-4 py-3 max-w-7xl mx-auto">

<div class="flex gap-4">

<span>Início</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-500 px-4 py-1.5 font-['Plus_Jakarta_Sans'] text-[11px] font-semibold">
<span class="material-symbols-outlined" data-icon="storefront">storefront</span>
<span>Feiras</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-500 px-4 py-1.5 font-['Plus_Jakarta_Sans'] text-[11px] font-semibold">
